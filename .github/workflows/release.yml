name: Release

# Tag a commit `v1.2.3` and push the tag -> builds Keychange 1.2.3 and attaches
# the zipped app to a GitHub release of that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # macOS renders apps linked against an older SDK in the previous appearance
    # (square corners, opaque panels), so the runner's SDK has to be current.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 if present
        run: |
          # Prefer the toolchain the app is developed with; fall back to the image default.
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      # The Developer ID certificate lives in the repo secrets as a base64'd .p12.
      # It goes into a throwaway keychain that dies with the runner.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          rm cert.p12
          security find-identity -v -p codesigning build.keychain

      - name: Build (version from tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project Keychange.xcodeproj -scheme Keychange -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=N3BEDTWSK4 \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      # The notarization ticket staples into the .app, so the release zip has to
      # be built after stapling — hence zipping twice.
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=build/Build/Products/Release/Keychange.app
          # `xcodebuild build` (unlike `archive`) can drop the secure timestamp the
          # notary service requires. The app has no nested code, so one re-sign with
          # explicit flags is enough to guarantee what gets submitted.
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "$APP"
          codesign -dvvv "$APP"
          ditto -c -k --keepParent "$APP" notarize.zip
          # `submit --wait` exits non-zero when the result is Invalid, so capture the
          # id first and always print the notary log — it names the rejection reason.
          xcrun notarytool submit notarize.zip --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id N3BEDTWSK4 \
            > notary.json || true
          cat notary.json
          xcrun notarytool log "$(jq -r .id notary.json)" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id N3BEDTWSK4
          test "$(jq -r .status notary.json)" = Accepted
          xcrun stapler staple "$APP"
          ditto -c -k --keepParent "$APP" Keychange.zip
          spctl -a -vvv -t exec "$APP"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Keychange.zip --generate-notes
