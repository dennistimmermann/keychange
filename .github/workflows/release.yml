name: Release

# Tag a commit `v1.2.3` and push the tag -> builds Keychange 1.2.3 and attaches
# the zipped app to a GitHub release of that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # macOS renders apps linked against an older SDK in the previous appearance
    # (square corners, opaque panels), so the runner's SDK has to be current.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 if present
        run: |
          # Prefer the toolchain the app is developed with; fall back to the image default.
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Build (version from tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project Keychange.xcodeproj -scheme Keychange -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            build
        # ponytail: unsigned build (Gatekeeper will warn); once the signing
        # certificate is in the repo secrets, add a keychain-import step and
        # drop CODE_SIGNING_ALLOWED=NO, plus notarytool for distribution.

      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/Keychange.app Keychange.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Keychange.zip --generate-notes
